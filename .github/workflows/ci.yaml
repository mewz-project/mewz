name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  run-integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mewz
        uses: actions/checkout@v7
        with:
          repository: mewz-project/mewz
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: master
          cache: true

      - name: Install packages for running tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-system-x86 mtools virtiofsd

      - name: Cache mewz
        uses: actions/cache@v6
        with:
          path:
            zig-cache
          key: ${{ runner.os }}-mewz

      - name: Cache Newlib
        uses: actions/cache@v6
        with:
          path:
            build/newlib
          key: ${{ runner.os }}-mewz-newlib

      - name: Cache lwIP
        uses: actions/cache@v6
        with:
          path:
            build/lwip
          key: ${{ runner.os }}-mewz-lwip

      - name: Build Mewz
        run: zig build -Dtest=true -Doptimize=ReleaseFast

      - name: Run tests
        run: |
          ./scripts/integration-test.sh --ci
